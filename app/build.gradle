plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hozinking.gameTTT.TapTapTycoon'
    compileSdk 34

    defaultConfig {
        applicationId "com.hozinking.gameTTT.TapTapTycoon"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0.0 001_alpha"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
