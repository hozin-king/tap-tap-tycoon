name: Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # Android SDK sudah terpasang di runner ubuntu-latest (ANDROID_HOME),
      # jadi langkah setup-android dihapus: versi v3 gagal karena paket
      # 'tools' sudah tidak ada di sdkmanager (Failed to find package 'tools').
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # Lampirkan APK ke Release v1.0.0-001_alpha dari DALAM Actions
      # (upload asset langsung dari VM dulu 401, jadi jangan pernah dari VM).
      # gh CLI memakai GITHUB_TOKEN bawaan Actions; --clobber menimpa
      # asset lama dengan nama yang sama bila release sudah ada.
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TapTapTycoon-v1.0.0-001_alpha.apk
          gh release upload v1.0.0-001_alpha TapTapTycoon-v1.0.0-001_alpha.apk --clobber
